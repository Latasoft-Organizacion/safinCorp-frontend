<section class="py-12 bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto px-4">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-semibold text-gray-800">Charlas y Capacitaciones</h1>
      <p class="text-gray-600 mt-2">Conoce nuestras charlas sobre seguros, prevención y gestión de riesgos</p>
    </header>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-12">
      <p class="text-gray-600 text-lg">Cargando charlas...</p>
    </div>

    <!-- Sin charlas -->
    <div *ngIf="!cargando && charlas.length === 0" class="text-center py-12">
      <p class="text-gray-600 text-lg">No hay charlas disponibles en este momento.</p>
    </div>

    <!-- Lista de charlas -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let charla of charlas" class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-xl transition-shadow duration-300">
        <!-- Thumbnail de la charla -->
        <a [href]="charla.url" target="_blank" rel="noopener noreferrer" class="block">
          <div class="relative overflow-hidden group">
            <img 
              [src]="charla.thumbnail" 
              [alt]="charla.titulo" 
              class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300">
            <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all duration-300 flex items-center justify-center">
              <svg class="w-16 h-16 text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300" fill="currentColor" viewBox="0 0 20 20">
                <path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/>
              </svg>
            </div>
          </div>
        </a>

        <!-- Contenido -->
        <div class="p-6">
          <h2 class="text-xl font-bold text-gray-900 mb-2 line-clamp-2">{{ charla.titulo }}</h2>
          <p class="text-gray-700 mb-4 line-clamp-3">{{ charla.descripcion }}</p>
          <p *ngIf="charla.fecha" class="text-sm text-gray-500 mb-4">{{ charla.fecha }}</p>
          
          <a 
            [href]="charla.url" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="inline-flex items-center text-blue-600 hover:text-blue-800 font-semibold transition-colors duration-200">
            Ver charla
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </a>
        </div>
      </div>
    </div>

  </div>
</section>
