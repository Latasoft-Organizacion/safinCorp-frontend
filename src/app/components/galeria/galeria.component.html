<section class="py-12 bg-gray-100">
  <div class="max-w-6xl mx-auto px-4">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-semibold text-gray-800">Galería</h1>
      <p class="text-gray-600 mt-2">Conoce más sobre nosotros a través de nuestras imágenes y videos</p>
    </header>

    <!-- Estado de carga -->
    <div *ngIf="cargando" class="text-center py-12">
      <p class="text-gray-600 text-lg">Cargando galería...</p>
    </div>

    <!-- Iterar sobre cada categoría -->
    <div *ngFor="let categoria of categorias" class="mb-16">
      <!-- Título de la categoría (solo si hay más de un item) -->
      <div class="mb-8" *ngIf="categoria.items.length > 1">
        <h2 class="text-3xl font-bold text-gray-800 text-center mb-2">{{ categoria.nombre }}</h2>
        <div class="w-24 h-1 bg-blue-600 mx-auto rounded"></div>
      </div>

      <!-- Swiper para cada categoría -->
      <swiper-container 
        class="swiper-gallery" 
        navigation="true" 
        pagination="true"
        pagination-clickable="true"
        slides-per-view="1"
        space-between="30"
        loop="true">
        
        <!-- Iterar sobre cada item de la categoría -->
        <swiper-slide *ngFor="let item of categoria.items">
          <div class="bg-white p-8 rounded-lg shadow-lg border border-gray-200">
            <!-- Título del item (siempre mostrar si hay 1 item, o si hay más de 1) -->
            <h3 class="text-center text-2xl font-bold text-gray-900 mb-2">{{ categoria.items.length === 1 ? categoria.nombre : item.nombre }}</h3>
            <p class="text-gray-700 text-center text-lg mb-4" *ngIf="item.descripcion">{{ item.descripcion }}</p>

            <!-- Video MP4 local -->
            <div *ngIf="item.link && item.link.endsWith('.mp4')" class="flex justify-center">
              <video 
                [src]="item.link" 
                controls
                class="w-full md:w-3/4 lg:w-2/3 h-96 rounded-lg shadow-md"
                preload="metadata"
                controlsList="nodownload">
                Tu navegador no soporta el tag de video.
              </video>
            </div>

            <!-- Video o iframe (YouTube, Google Drive, etc) -->
            <div *ngIf="item.link && !item.link.endsWith('.mp4') && item.link.length > 0" class="flex justify-center">
              <iframe 
                [src]="item.link | safeUrl" 
                class="w-full md:w-3/4 lg:w-2/3 h-96 rounded-lg shadow-md" 
                frameborder="0" 
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>
            </div>

            <!-- Galería de fotos (si no hay link, mostrar fotos) -->
            <div *ngIf="(!item.link || item.link.length === 0) && item.fotos && item.fotos.length > 0" class="mt-6">
              <!-- Si es solo 1 foto (ej: certificados), centrar y hacer más grande -->
              <div *ngIf="item.fotos.length === 1" class="flex justify-center">
                <img 
                  [src]="item.fotos[0]" 
                  [alt]="item.nombre" 
                  (click)="expandirImagen(item.fotos[0], item.nombre)"
                  class="max-w-full md:max-w-2xl h-auto rounded-lg shadow-lg cursor-pointer hover:opacity-90 transition-opacity">
              </div>
              
              <!-- Si son múltiples fotos, mostrar en grid -->
              <div *ngIf="item.fotos.length > 1" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 max-w-5xl mx-auto">
                <div *ngFor="let foto of item.fotos" class="overflow-hidden rounded-lg shadow hover:shadow-lg transition-shadow">
                  <img 
                    [src]="foto" 
                    [alt]="item.nombre"
                    (click)="expandirImagen(foto, item.nombre)" 
                    class="w-full h-48 object-cover hover:scale-105 transition-transform duration-300 cursor-pointer">
                </div>
              </div>
            </div>
          </div>
        </swiper-slide>

      </swiper-container>
    </div>

  </div>

  <!-- Modal/Lightbox para imagen expandida -->
  <div 
    *ngIf="imagenExpandida" 
    class="modal-backdrop fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4"
    (click)="cerrarModal()">
    
    <div class="relative max-w-6xl w-full">
      <!-- Botón cerrar -->
      <button 
        (click)="cerrarModal()"
        class="absolute -top-10 right-0 text-white hover:text-gray-300 transition-colors z-10"
        aria-label="Cerrar">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Título -->
      <div class="absolute -top-10 left-0 text-white text-base font-semibold">
        {{ tituloImagenExpandida }}
      </div>

      <!-- Hint: presiona ESC para cerrar -->
      <div class="absolute -bottom-10 left-0 text-white text-sm opacity-70">
        Presiona ESC o haz click afuera para cerrar
      </div>

      <!-- Imagen -->
      <img 
        [src]="imagenExpandida" 
        [alt]="tituloImagenExpandida"
        (click)="$event.stopPropagation()"
        class="modal-image max-w-full max-h-[70vh] object-contain rounded-lg shadow-2xl mx-auto">
    </div>
  </div>
</section>
