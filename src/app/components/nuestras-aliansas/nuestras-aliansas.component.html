<div class="text-center py-8 bg-white">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">Nuestras Alianzas</h2>
  <div class="flex flex-wrap justify-center gap-6 px-4">
    <a *ngFor="let alianza of imagenes" [attr.href]="alianza.url" target="_blank" rel="noopener noreferrer">
      <img [src]="alianza.logoAliansas" alt="Logo de alianza"
           class="h-16 md:h-20 lg:h-24 object-contain  hover:grayscale-0 transition-transform transform hover:scale-110">
    </a>
  </div>
</div>
